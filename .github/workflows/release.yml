name: Release

# Pushing a tag such as v1.2.0 creates a draft GitHub Release with the editor,
# PDFs and a SHA256SUMS file attached. Add the .hfe disk image to the draft
# (it is built privately), then publish.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage assets
        run: |
          v="${GITHUB_REF_NAME}"
          mkdir dist
          cp editor/phantasm-editor.html "dist/phantasm-editor-${v}.html"
          cp editor/phantasm-editor.html dist/phantasm-editor.html
          cp docs/phantasm-manual.pdf "dist/phantasm-manual-${v}.pdf"
          cp docs/phantasm-param-card.pdf "dist/phantasm-param-card-${v}.pdf"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes $pre \
            --title "Phantasm OS and Editor ${GITHUB_REF_NAME}"
