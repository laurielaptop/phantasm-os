<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 410" role="img"><title>One Phantasm voice</title><desc>Each of the eight voices reads a wave from the wavetable at the wave pointer. Oscillator A plays it; oscillator B plays a detuned copy, noise, or a hard-synced copy. The Ensoniq DOC chip sets each oscillator's volume from ENV1 and the levels, digitally; a DAC turns the result into a voltage, and the voice's own analog CEM 3328 low-pass filter shapes it before the eight voices are mixed to the output. Under each stage, the parameters that move it: the wave pointer, pitch, loudness and brightness.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:400;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}.tx{font-size:11px;font-weight:400;fill:#5F5E5A}.tn{font-size:10px;font-weight:500;fill:#888780}.tc{font-size:10.5px;font-weight:400;fill:#5F5E5A}.rule{stroke:#B4B2A9}.leader{stroke:#888780;stroke-width:1;stroke-dasharray:3 3;fill:none}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.wave{stroke:#534AB7;stroke-width:1.5;fill:none;stroke-linejoin:round}.axis{stroke:#D3D1C7;stroke-width:.5}.hot{fill:none;stroke:#993C1D;stroke-width:2}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.t,.c-purple>.th{fill:#3C3489}.c-purple>.ts,.c-purple>.tx,.c-purple>.tc{fill:#3C3489}.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.t,.c-teal>.th{fill:#085041}.c-teal>.ts,.c-teal>.tx,.c-teal>.tc{fill:#085041}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.t,.c-coral>.th{fill:#712B13}.c-coral>.ts,.c-coral>.tx,.c-coral>.tc{fill:#712B13}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.t,.c-gray>.th{fill:#444441}.c-gray>.ts,.c-gray>.tx,.c-gray>.tc{fill:#5F5E5A}.c-amber>rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.t,.c-amber>.th{fill:#633806}.c-amber>.ts,.c-amber>.tx,.c-amber>.tc{fill:#633806}.c-empty>rect,rect.c-empty{fill:none;stroke:#D3D1C7;stroke-dasharray:3 3}.c-empty>.tn{fill:#B4B2A9}@media (prefers-color-scheme:dark){.t,.th{fill:#F1EFE8}.ts,.tx{fill:#B4B2A9}.tn{fill:#888780}.rule{stroke:#5F5E5A}.arr{stroke:#B4B2A9}.wave{stroke:#AFA9EC}.axis{stroke:#444441}.hot{stroke:#F0997B}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.t,.c-purple>.th{fill:#CECBF6}.c-purple>.ts,.c-purple>.tx{fill:#AFA9EC}.c-purple>.tc{fill:#CECBF6}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.t,.c-teal>.th{fill:#9FE1CB}.c-teal>.ts,.c-teal>.tx{fill:#5DCAA5}.c-teal>.tc{fill:#9FE1CB}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.t,.c-coral>.th{fill:#F5C4B3}.c-coral>.ts,.c-coral>.tx{fill:#F0997B}.c-coral>.tc{fill:#F5C4B3}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.t,.c-gray>.th{fill:#D3D1C7}.c-gray>.ts,.c-gray>.tx,.c-gray>.tc{fill:#D3D1C7}.c-amber>rect,rect.c-amber{fill:#633806;stroke:#EF9F27}.c-amber>.t,.c-amber>.th{fill:#FAC775}.c-amber>.ts,.c-amber>.tx{fill:#EF9F27}.c-amber>.tc{fill:#FAC775}.c-empty>rect,rect.c-empty{stroke:#5F5E5A}.c-empty>.tn{fill:#5F5E5A}}</style>
<text class="th" x="20" y="30">One voice, end to end (eight voices, each with all of this)</text>
<g class="c-purple"><rect x="20" y="82" width="110" height="76" rx="4" stroke-width="0.5"/><text class="th" x="75.0" y="109.0" text-anchor="middle">Wavetable</text><text class="ts" x="75.0" y="125.0" text-anchor="middle">the pointer</text><text class="ts" x="75.0" y="141.0" text-anchor="middle">picks a wave</text></g>
<g class="c-purple"><rect x="160" y="62" width="124" height="52" rx="4" stroke-width="0.5"/><text class="th" x="222.0" y="86.0" text-anchor="middle">Oscillator A</text><text class="tx" x="222.0" y="100.0" text-anchor="middle">plays the wave</text></g>
<g class="c-purple"><rect x="160" y="126" width="124" height="52" rx="4" stroke-width="0.5"/><text class="th" x="222.0" y="150.0" text-anchor="middle">Oscillator B</text><text class="tx" x="222.0" y="164.0" text-anchor="middle">wave, noise, sync (28)</text></g>
<g class="c-teal"><rect x="314" y="82" width="120" height="76" rx="4" stroke-width="0.5"/><text class="th" x="374.0" y="110.0" text-anchor="middle">Volume</text><text class="ts" x="374.0" y="126.0" text-anchor="middle">ENV1 x level</text><text class="tx" x="374.0" y="140.0" text-anchor="middle">DOC chip, digital</text></g>
<g class="c-coral"><rect x="464" y="82" width="120" height="76" rx="4" stroke-width="0.5"/><text class="th" x="524.0" y="110.0" text-anchor="middle">Low-pass</text><text class="ts" x="524.0" y="126.0" text-anchor="middle">CEM 3328</text><text class="tx" x="524.0" y="140.0" text-anchor="middle">analog, per voice</text></g>
<g class="c-gray"><rect x="604" y="82" width="64" height="76" rx="4" stroke-width="0.5"/><text class="tx" x="636.0" y="109.0" text-anchor="middle">8 voices</text><text class="tx" x="636.0" y="123.0" text-anchor="middle">mixed</text><text class="tx" x="636.0" y="137.0" text-anchor="middle">to out</text></g>
<line class="arr" x1="130" y1="108" x2="158" y2="88" marker-end="url(#arrow)"/>
<line class="arr" x1="130" y1="132" x2="158" y2="152" marker-end="url(#arrow)"/>
<line class="arr" x1="284" y1="88" x2="312" y2="108" marker-end="url(#arrow)"/>
<line class="arr" x1="284" y1="152" x2="312" y2="132" marker-end="url(#arrow)"/>
<line class="arr" x1="434" y1="120" x2="462" y2="120" marker-end="url(#arrow)"/>
<line class="arr" x1="584" y1="120" x2="602" y2="120" marker-end="url(#arrow)"/>
<text class="tn" x="449" y="112" text-anchor="middle">DAC</text>
<line class="leader" x1="449" y1="44" x2="449" y2="76"/>
<line class="leader" x1="449" y1="160" x2="449" y2="190"/>
<text class="tn" x="443" y="186" text-anchor="end">digital</text>
<text class="tn" x="455" y="186">analog</text>
<g class="c-gray"><rect x="20" y="236" width="110" height="118" rx="4" stroke-width="0.5"/><text class="th" x="28" y="256">Wave pointer</text><text class="tx" x="28" y="276">12 start, 18 seq.</text><text class="tx" x="28" y="293">ENV3 85=5</text><text class="tx" x="28" y="310">LFO 17, vel. 14</text><text class="tx" x="28" y="327">key 15, wheel 38=1</text><text class="tx" x="28" y="344">pressure 39=1</text></g>
<line class="leader" x1="75.0" y1="234" x2="75.0" y2="162" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="160" y="236" width="124" height="118" rx="4" stroke-width="0.5"/><text class="th" x="168" y="256">Pitch</text><text class="tx" x="168" y="276">20-23 coarse, fine</text><text class="tx" x="168" y="293">bend 25, LFO 31</text><text class="tx" x="168" y="310">ENV3 85=0-2</text><text class="tx" x="168" y="327">glide 63</text><text class="tx" x="168" y="344">vintage 26</text></g>
<line class="leader" x1="222.0" y1="234" x2="222.0" y2="182" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="314" y="236" width="120" height="118" rx="4" stroke-width="0.5"/><text class="th" x="322" y="256">Loudness</text><text class="tx" x="322" y="276">ENV1 50-54</text><text class="tx" x="322" y="293">amp level 75</text><text class="tx" x="322" y="310">velocity 76</text><text class="tx" x="322" y="327">A level 27</text><text class="tx" x="322" y="344">B level 24</text></g>
<line class="leader" x1="374.0" y1="234" x2="374.0" y2="162" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="464" y="236" width="120" height="118" rx="4" stroke-width="0.5"/><text class="th" x="472" y="256">Brightness</text><text class="tx" x="472" y="276">cutoff 70, res. 71</text><text class="tx" x="472" y="293">ENV2 40-44 by 72</text><text class="tx" x="472" y="310">key 73, vel. 74</text><text class="tx" x="472" y="327">LFO 34, wave 77</text><text class="tx" x="472" y="344">pressure 39=2</text></g>
<line class="leader" x1="524.0" y1="234" x2="524.0" y2="162" marker-end="url(#arrow)"/>
<text class="tx" x="20" y="382">Under each stage, the parameters that move it. ENV1 shapes loudness, ENV2 the filter, and ENV3</text>
<text class="tx" x="20" y="398">one destination of your choice (85). Each voice has its own LFO.</text>
</svg>
