<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 330" role="img"><title>Wave sequencing</title><desc>A sequence is a list of start positions in the table, here eight steps. In step mode (parameter 18 = 1) the first key starts at step 0, the second at step 1 and so on, and each note then scans from its own start. Mode 0 is off, 2 steps per voice, 3 picks a random step, 4 steps on each LFO cycle while the key is held. Parameter 19 restarts the sequence after a silence, and PARAM 9 4 restarts it by hand.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:400;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;font-weight:400;fill:#5F5E5A}.tx{font-size:11px;font-weight:400;fill:#5F5E5A}.tn{font-size:10px;font-weight:500;fill:#888780}.tc{font-size:10.5px;font-weight:400;fill:#5F5E5A}.rule{stroke:#B4B2A9}.leader{stroke:#888780;stroke-width:1;stroke-dasharray:3 3;fill:none}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.wave{stroke:#534AB7;stroke-width:1.5;fill:none;stroke-linejoin:round}.axis{stroke:#D3D1C7;stroke-width:.5}.hot{fill:none;stroke:#993C1D;stroke-width:2}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.t,.c-purple>.th{fill:#3C3489}.c-purple>.ts,.c-purple>.tx,.c-purple>.tc{fill:#3C3489}.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.t,.c-teal>.th{fill:#085041}.c-teal>.ts,.c-teal>.tx,.c-teal>.tc{fill:#085041}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.t,.c-coral>.th{fill:#712B13}.c-coral>.ts,.c-coral>.tx,.c-coral>.tc{fill:#712B13}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.t,.c-gray>.th{fill:#444441}.c-gray>.ts,.c-gray>.tx,.c-gray>.tc{fill:#5F5E5A}.c-amber>rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.t,.c-amber>.th{fill:#633806}.c-amber>.ts,.c-amber>.tx,.c-amber>.tc{fill:#633806}.c-empty>rect,rect.c-empty{fill:none;stroke:#D3D1C7;stroke-dasharray:3 3}.c-empty>.tn{fill:#B4B2A9}@media (prefers-color-scheme:dark){.t,.th{fill:#F1EFE8}.ts,.tx{fill:#B4B2A9}.tn{fill:#888780}.rule{stroke:#5F5E5A}.arr{stroke:#B4B2A9}.wave{stroke:#AFA9EC}.axis{stroke:#444441}.hot{stroke:#F0997B}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}.c-purple>.t,.c-purple>.th{fill:#CECBF6}.c-purple>.ts,.c-purple>.tx{fill:#AFA9EC}.c-purple>.tc{fill:#CECBF6}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}.c-teal>.t,.c-teal>.th{fill:#9FE1CB}.c-teal>.ts,.c-teal>.tx{fill:#5DCAA5}.c-teal>.tc{fill:#9FE1CB}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B}.c-coral>.t,.c-coral>.th{fill:#F5C4B3}.c-coral>.ts,.c-coral>.tx{fill:#F0997B}.c-coral>.tc{fill:#F5C4B3}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}.c-gray>.t,.c-gray>.th{fill:#D3D1C7}.c-gray>.ts,.c-gray>.tx,.c-gray>.tc{fill:#D3D1C7}.c-amber>rect,rect.c-amber{fill:#633806;stroke:#EF9F27}.c-amber>.t,.c-amber>.th{fill:#FAC775}.c-amber>.ts,.c-amber>.tx{fill:#EF9F27}.c-amber>.tc{fill:#FAC775}.c-empty>rect,rect.c-empty{stroke:#5F5E5A}.c-empty>.tn{fill:#5F5E5A}}</style>
<text class="th" x="20" y="30">Wave sequencing: each new note can start somewhere else</text>
<text class="ts" x="20" y="48">Parameter 11 picks a sequence, a list of start positions in the table. 18 says how notes use it.</text>
<text class="ts" x="20" y="104">Sequence</text>
<g class="c-purple"><rect x="110" y="80" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="140.0" y="94.0" text-anchor="middle">step 0</text><text class="ts" x="140.0" y="110.0" text-anchor="middle">entry 0</text></g>
<g class="c-purple"><rect x="178" y="80" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="208.0" y="94.0" text-anchor="middle">step 1</text><text class="ts" x="208.0" y="110.0" text-anchor="middle">entry 18</text></g>
<g class="c-purple"><rect x="246" y="80" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="276.0" y="94.0" text-anchor="middle">step 2</text><text class="ts" x="276.0" y="110.0" text-anchor="middle">entry 5</text></g>
<g class="c-purple"><rect x="314" y="80" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="344.0" y="94.0" text-anchor="middle">step 3</text><text class="ts" x="344.0" y="110.0" text-anchor="middle">entry 27</text></g>
<g class="c-purple"><rect x="382" y="80" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="412.0" y="94.0" text-anchor="middle">step 4</text><text class="ts" x="412.0" y="110.0" text-anchor="middle">entry 9</text></g>
<g class="c-purple"><rect x="450" y="80" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="480.0" y="94.0" text-anchor="middle">step 5</text><text class="ts" x="480.0" y="110.0" text-anchor="middle">entry 31</text></g>
<g class="c-purple"><rect x="518" y="80" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="548.0" y="94.0" text-anchor="middle">step 6</text><text class="ts" x="548.0" y="110.0" text-anchor="middle">entry 2</text></g>
<g class="c-purple"><rect x="586" y="80" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="616.0" y="94.0" text-anchor="middle">step 7</text><text class="ts" x="616.0" y="110.0" text-anchor="middle">entry 22</text></g>
<text class="ts" x="20" y="220">Keys, in order</text>
<g class="c-coral"><rect x="110" y="196" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="140.0" y="210.0" text-anchor="middle">note 1</text><text class="ts" x="140.0" y="226.0" text-anchor="middle">C</text></g>
<line class="arr" x1="140" y1="194" x2="140" y2="124" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="178" y="196" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="208.0" y="210.0" text-anchor="middle">note 2</text><text class="ts" x="208.0" y="226.0" text-anchor="middle">E</text></g>
<line class="arr" x1="208" y1="194" x2="208" y2="124" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="246" y="196" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="276.0" y="210.0" text-anchor="middle">note 3</text><text class="ts" x="276.0" y="226.0" text-anchor="middle">G</text></g>
<line class="arr" x1="276" y1="194" x2="276" y2="124" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="314" y="196" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="344.0" y="210.0" text-anchor="middle">note 4</text><text class="ts" x="344.0" y="226.0" text-anchor="middle">C</text></g>
<line class="arr" x1="344" y1="194" x2="344" y2="124" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="382" y="196" width="60" height="40" rx="4" stroke-width="0.5"/><text class="tn" x="412.0" y="210.0" text-anchor="middle">note 5</text><text class="ts" x="412.0" y="226.0" text-anchor="middle">D</text></g>
<line class="arr" x1="412" y1="194" x2="412" y2="124" marker-end="url(#arrow)"/>
<text class="ts" x="454" y="210">18 = 1, step: every key</text>
<text class="ts" x="454" y="226">takes the next step</text>
<text class="tx" x="454" y="242">Each note then scans from there.</text>
<text class="tx" x="20" y="270">18 = 0  off: every note starts at 12</text>
<text class="tx" x="240" y="270">18 = 1  step: one step per key</text>
<text class="tx" x="460" y="270">18 = 2  per voice: each voice its own step</text>
<text class="tx" x="20" y="290">18 = 3  random step per key</text>
<text class="tx" x="240" y="290">18 = 4  LFO: steps on each LFO cycle while held</text>
<text class="tx" x="20" y="314">After a silence of 19, the sequence starts again at step 0; PARAM 9 4 restarts it by hand.</text>
</svg>
