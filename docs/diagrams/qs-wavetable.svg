<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 380" role="img"><title>A wavetable and its pointer</title><desc>A wavetable is an ordered list of single-cycle waves; parameter 10 picks it. Eight of the 32 entries of the factory table analog are drawn, from a sine through triangle and saw to a narrow pulse. Parameter 12 sets where in the table a note starts, 0 the first entry and 99 the last. ENV3, the LFO, velocity, key, the mod wheel and pressure then move the wave pointer either way from that start. Parameter 13 decides what happens past the end: 0 clamps, 1 wraps.</desc>
